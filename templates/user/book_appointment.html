{% extends 'base.html' %}
{% block title %}Book Appointment{% endblock %}

{% block content %}
<div class="card" style="max-width: 560px; margin: 2rem auto;">
    <h2>Book an appointment</h2>
    <form method="post">
        <div class="form-group">
            <label for="service_id">Service</label>
            <select id="service_id" name="service_id" required>
                <option value="">Select a service</option>
                {% for service in services %}
                    <option value="{{ service['id'] }}">{{ service['name'] }} &mdash; {{ service['category'] }} ({{ service['duration'] }} min)</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="appointment_date">Date</label>
            <input type="date" id="appointment_date" name="appointment_date" required>
        </div>
        <div class="form-group">
            <label for="appointment_time">Time</label>
            <input type="time" id="appointment_time" name="appointment_time" required>
        </div>
        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="4"></textarea>
        </div>
        <div class="form-group">
            <label for="reminder_minutes">Reminder (minutes before)</label>
            <input type="number" id="reminder_minutes" name="reminder_minutes" min="0" placeholder="Optional">
        </div>
        <button class="btn btn-primary" type="submit">Book Now</button>
    </form>
</div>
{% endblock %}
