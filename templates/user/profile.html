{% extends 'base.html' %}
{% block title %}Profile{% endblock %}

{% block content %}
<div class="card" style="max-width: 640px; margin: 2rem auto;">
    <h2>Manage profile</h2>
    <form method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ user['username'] }}" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ user['email'] }}" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" value="{{ user['phone'] or '' }}">
        </div>
        <div class="form-group">
            <label for="current_password">Current password</label>
            <input type="password" id="current_password" name="current_password" placeholder="Required to change password">
        </div>
        <div class="form-group">
            <label for="new_password">New password</label>
            <input type="password" id="new_password" name="new_password">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm new password</label>
            <input type="password" id="confirm_password" name="confirm_password">
        </div>
        <button class="btn btn-primary" type="submit">Save changes</button>
    </form>
</div>
{% endblock %}
